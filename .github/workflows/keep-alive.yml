name: Keep-alive ping

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health check
        continue-on-error: true
        run: curl -sf --max-time 20 https://job-tracker-api.onrender.com/api/health

      - name: Ping scrapper health check
        continue-on-error: true
        run: curl -sf --max-time 20 https://job-tracker-scrapper.onrender.com/health
