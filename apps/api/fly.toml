# fly.toml app configuration file for job-tracker-api
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Secrets (set via `fly secrets set`, do not put here):
#   DATABASE_URL, JWT_SECRET, GEMINI_API_KEY, SEED_SECRET,
#   SEED_USER_OSVALDO_PASSWORD, SEED_USER_GUILLERMO_PASSWORD, SCRAPER_URL

app = 'job-tracker-api'
primary_region = 'dfw'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
