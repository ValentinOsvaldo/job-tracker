# fly.toml app configuration file for job-tracker-scrapper
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Secrets (set via `fly secrets set`, do not put here):
#   NESTJS_URL -> the job-tracker-api Fly URL, e.g. https://job-tracker-api.fly.dev

app = 'job-tracker-scrapper'
primary_region = 'dfw'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
