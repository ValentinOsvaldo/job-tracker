app = "job-tracker-scrapper"
primary_region = "dfw"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8_080
min_machines_running = 0
processes = [ "app" ]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
memory_mb = 512

[processes]
  app = "uvicorn main:app --host 0.0.0.0 --port 8080"
