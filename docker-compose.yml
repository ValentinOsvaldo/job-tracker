# Everything runs locally: `docker compose up --build` → http://localhost:3001
# There is no login, so ports are bound to 127.0.0.1 only (not reachable from your LAN).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobtracker
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d jobtracker']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobtracker
      SCRAPER_URL: http://scrapper:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - '127.0.0.1:3000:3000'

  scrapper:
    build: ./apps/scrapper
    restart: unless-stopped
    environment:
      NESTJS_URL: http://api:3000
      PORT: 8000
      SEARCH_TERMS: ${SEARCH_TERMS:-}
      LOCATIONS: ${LOCATIONS:-}

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_API_BASE_URL: http://api:3000
    ports:
      - '127.0.0.1:3001:3001'

volumes:
  postgres_data:
