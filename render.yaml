services:
  - type: web
    name: job-tracker-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string, e.g. postgresql://user:pass@host.neon.tech/db?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2d
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: '7'
      - key: SEED_SECRET
        sync: false # must match NUXT_SEED_SECRET on the Vercel side
      - key: SEED_USER_OSVALDO_PASSWORD
        sync: false
      - key: SEED_USER_GUILLERMO_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_BATCH_SIZE
        value: '5'
      - key: AI_BATCH_DELAY_MS
        value: '200'
      - key: TRENDS_CACHE_TTL_HOURS
        value: '6'
      - key: SCRAPER_URL
        sync: false # https://job-tracker-scrapper.onrender.com (Render assigns this on first deploy)

  - type: web
    name: job-tracker-scrapper
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/scrapper/Dockerfile
    dockerContext: ./apps/scrapper
    healthCheckPath: /health
    envVars:
      - key: NESTJS_URL
        sync: false # https://job-tracker-api.onrender.com (Render assigns this on first deploy)
      - key: SEARCH_TERMS
        value: 'software engineer,frontend developer,backend developer'
      - key: LOCATIONS
        value: 'mexico,worldwide'
      - key: RESULTS
        value: '30'
      - key: HOURS_OLD
        value: '48'
      - key: SCRAPE_INTERVAL_HOURS
        value: '6'
      - key: LINKEDIN_FETCH_DESCRIPTION
        value: 'true'
      - key: ENFORCE_ANNUAL_SALARY
        value: 'true'
      - key: RELEVANCE_FILTER
        value: 'true'
